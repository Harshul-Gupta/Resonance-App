spring.application.name=ArtistRegistry
spring.mvc.view.prefix= /Views/
spring.mvc.view.suffix= .jsp

server.port=8083
server.address=0.0.0.0
server.forward-headers-strategy=framework

spring.mongodb.uri=${MONGO_URI}
spring.mongodb.database=Harshul

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code

logging.level.root=info

# AWS Configuration
aws.bucket.name=hars-demo-v1
aws.region=${AWS_REGION:ap-south-1}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# RapidAPI Configuration
rapidapi.spotify.url=${RAPID_URL}
rapidapi.spotify.key=${RAPID_KEY}
rapidapi.spotify.host=spotify-artist-monthly-listeners.p.rapidapi.com

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

spring.kafka.consumer.group-id=resonance-core-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.properties.spring.json.trusted.packages = "*"

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

#Eureka
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
